<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0c"/>
      <stop offset="50%" stop-color="#0f1318"/>
      <stop offset="100%" stop-color="#1a1f26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a44e"/>
      <stop offset="50%" stop-color="#f0d98a"/>
      <stop offset="100%" stop-color="#c9a44e"/>
    </linearGradient>
    <linearGradient id="goldDim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a44e" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#f0d98a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9a44e" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle camera outline (top right) -->
  <g transform="translate(880, 80)" opacity="0.06" fill="#ffffff">
    <rect x="0" y="20" width="220" height="150" rx="14" stroke="#fff" stroke-width="3" fill="none"/>
    <rect x="70" y="8" width="80" height="20" rx="4"/>
    <circle cx="110" cy="95" r="38" stroke="#fff" stroke-width="3" fill="none"/>
    <circle cx="110" cy="95" r="22" stroke="#fff" stroke-width="2" fill="none"/>
    <circle cx="180" cy="42" r="4"/>
  </g>

  <!-- Gold accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#goldDim)"/>

  <!-- Gold accent line bottom -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#goldDim)"/>

  <!-- Brand mark (camera + SV) -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="url(#gold)" opacity="0.95"/>
    <text x="36" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#080a0c" text-anchor="middle">SV</text>
  </g>

  <!-- Main title -->
  <text x="80" y="310" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="4">SHOTBYVOR</text>

  <!-- Gold underline -->
  <rect x="82" y="340" width="420" height="3" fill="url(#gold)"/>

  <!-- Subtitle -->
  <text x="80" y="400" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#c9a44e" letter-spacing="6">PHOTOGRAPHY &amp; FILMS</text>

  <!-- Tagline -->
  <text x="80" y="470" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="300" fill="#a0a8b0" letter-spacing="1">Portraits · Events · Weddings · Concerts · Reels</text>

  <!-- URL -->
  <text x="80" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#6b7480" letter-spacing="2">shotbyvor.com</text>
</svg>
